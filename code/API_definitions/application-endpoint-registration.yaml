---
openapi: 3.0.3
info:
  title: Application Endpoints Registration
  version: wip
  x-camara-commonalities: wip
  description: |
    The Application Endpoints Registration API provides a programmable
    interface for developers to register the endpoints of an application
    which is deployed across various Edge Cloud Zones.
    It allows developers to retrieve, update, and delete those registrations.

    # Introduction

    Application providers need to make their services discoverable when
    deployed across edge infrastructure. This API allows an application
    developer to register the endpoints (FQDN or IP address, and port) of
    application instances deployed across different Edge Cloud Zones, update
    them when necessary, and remove them when they are decommissioned.

    The API registers the Application Endpoints.
    This information can be used for various use cases like optimal endpoint
    discovery to help end users connect to the most optimal instance of the
    application which is distributed across various Edge Cloud Zones.
    Additionally the information can be used to monitor the edge instances to
    take decisions from a lifecycle management perspective. The API provides
    the ability to register, read and manage the deployed edge instances of
    the application.

    The registered endpoints are not consumed through this API by other
    parties. Their purpose is to make the application discoverable through
    the Application Endpoint Discovery API:

    - On successful registration, this API returns an
    `applicationEndpointListId`.
    - The application developer's server passes this identifier as
    `applicationEndpointsId` when calling the Application Endpoint Discovery
    API, which returns the optimal registered endpoint(s) for a given
    end-user device.
    - Registration is needed for applications that are not deployed through
    the Edge Application Management API, for example applications deployed by
    the developer directly or on a third-party Edge Cloud platform.
    Applications deployed through Edge Application Management are discovered
    by their `appId` instead.

    Application Endpoint Registration could be useful in scenarios such as:

    - Gaming: multiplayer server endpoints, registered as new instances are
    started, so that players connect to a nearby server.
    - Video streaming: media server endpoints, so that clients find the best
    available streaming source.
    - IoT platforms: data processing endpoints, so that devices connect to an
    available nearby service.
    - AR/VR services: rendering endpoints, to provide low-latency experiences
    to nearby users.

    Registered endpoints are only accessible to the API client that registered
    them.

    # Relevant terms and definitions

    * **Application Endpoint**:

    The Endpoint on which the application is accessible.
    It can be a FQDN, IPv4, or IPv6 address with a port number.

    * **Application Profile**:

    It represents the application's network and
    compute characteristics. This helps distinguish between different
    applications and their specific requirements.

    * **Edge Cloud Zone**:

    Availability Zone in an Edge Cloud. It is the lowest
    level of abstraction exposed to an Application Provider who wants to
    deploy an Application on Edge Cloud. Availability Zones exist within
    a Region.

    # API functionality

    The API provides the following operations:
    - POST registerApplicationEndpoints: Registers the Application Endpoints
                    of a deployed application to a specified edge cloud zone.
    - GET getAllRegisteredApplicationEndpoints: Returns endpoint information for
      all registered Applications.
    - GET getApplicationEndpointsById: Returns endpoint information for all
        Applications registered to a specified applicationEndpointListId.
    - PUT updateApplicationEndpoint: Update registered application endpoint
        information.
    - DELETE deregisterApplicationEndpoint: Deregister an application's
                          Endpoints.

    ## Errors

    - If the request contains a formatting or any other syntactic error, or a
    request body that does not comply with the schema, a `400 INVALID_ARGUMENT`
    error is returned.
    - If the request cannot be authenticated due to missing, invalid, or
    expired credentials, a `401 UNAUTHENTICATED` error is returned.
    - If the access token does not have the required scope, a
    `403 PERMISSION_DENIED` error is returned.
    - If the `applicationEndpointListId` does not identify registered
    application endpoints, a `404 NOT_FOUND` error is returned.
    - If the `applicationProfileId` in the request body does not identify an
    existing application profile, a `404 NOT_FOUND` error is returned.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

